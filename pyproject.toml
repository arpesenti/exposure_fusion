[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure_fusion"
version = "0.2"
description = "Exposure fusion of multiple images"
license = { text = "MIT" }
keywords = ["computer vision", "exposure fusion"]
authors = [
  { name = "Armando Pesenti Gritti", email = "arpesenti@gmail.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "opencv-python>=3",
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/arpesenti/exposure_fusion"

[tool.setuptools.packages.find]
include = ["exposure_fusion*"]
